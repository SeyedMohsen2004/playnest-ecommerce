name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: playnest_ci
      POSTGRES_USER: playnest_ci
      POSTGRES_PASSWORD: playnest_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: playnest_ci
          POSTGRES_USER: playnest_ci
          POSTGRES_PASSWORD: playnest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playnest_ci -d playnest_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-build.txt
            backend/requirements.txt

      - name: Install backend requirements
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements.txt

      - name: Verify generated Python locks
        run: |
          python -m piptools compile --generate-hashes --allow-unsafe --no-build-isolation --resolver=backtracking --strip-extras --output-file=requirements-build.txt requirements-build.in
          python -m piptools compile --generate-hashes --no-build-isolation --resolver=backtracking --strip-extras --output-file=requirements.txt requirements-dev.in
          python -m piptools compile --generate-hashes --no-build-isolation --resolver=backtracking --strip-extras --output-file=requirements.prod.txt requirements-prod.in
          git diff --exit-code -- requirements-build.txt requirements.txt requirements.prod.txt

      - name: Check Python environment consistency
        run: python -m pip check

      - name: Run Django system check
        run: python manage.py check

      - name: Check for migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Validate generated OpenAPI schema
        run: python manage.py spectacular --file /tmp/schema.yml --validate

      - name: Run tests with branch coverage
        run: >-
          pytest
          --cov
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=76

      - name: Check formatting
        run: black --check .

      - name: Run lint checks
        run: flake8 .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Test production runtime contracts
        run: node --test production-runtime.test.mjs

      - name: Build frontend
        run: npm run build

  production-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PRODUCTION_COMPOSE_PROJECT_NAME: playnest-production-ci
      PRODUCTION_POSTGRES_VOLUME_NAME: playnest-production-postgres-ci
      PRODUCTION_STATIC_PATH: /tmp/playnest-staticfiles
      PRODUCTION_MEDIA_PATH: /tmp/playnest-media
      DJANGO_SECRET_KEY: ci-only-production-secret-key-not-for-real-use-0123456789
      DJANGO_ALLOWED_HOSTS: api.example.invalid
      CSRF_TRUSTED_ORIGINS: https://shop.example.invalid,https://api.example.invalid
      CORS_ALLOWED_ORIGINS: https://shop.example.invalid
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      DJANGO_SECURE_HSTS_PRELOAD: "False"
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"
      DJANGO_TRUST_X_FORWARDED_PROTO: "True"
      POSTGRES_DB: playnest_ci
      POSTGRES_USER: playnest_ci
      POSTGRES_PASSWORD: ci-only-database-password
      SMS_PROVIDER: disabled
      ZARINPAL_MERCHANT_ID: ci-only-zarinpal-merchant
      ZARINPAL_SANDBOX: "True"
      ZARINPAL_CALLBACK_URL: https://api.example.invalid/api/v1/payments/zarinpal/callback/
      FRONTEND_BASE_URL: https://shop.example.invalid
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
      NEXT_PUBLIC_MEDIA_BASE_URL: https://shop.example.invalid/media
      INTERNAL_API_BASE_URL: http://api:8000/api/v1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate production Compose configuration
        run: |
          bash -n scripts/production-preflight.sh
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml config --format json > /tmp/production-compose.json
          python - <<'PY'
          import json

          with open("/tmp/production-compose.json", encoding="utf-8") as config_file:
              config = json.load(config_file)

          assert config["name"] == "playnest-production-ci"
          assert config["volumes"]["postgres_data"] == {
              "name": "playnest-production-postgres-ci",
              "external": True,
          }

          api = config["services"]["api"]
          mounts = {mount["target"]: mount for mount in api["volumes"]}
          assert mounts["/app/staticfiles"] == {
              "type": "bind",
              "source": "/tmp/playnest-staticfiles",
              "target": "/app/staticfiles",
              "bind": {},
          }
          assert mounts["/app/media"] == {
              "type": "bind",
              "source": "/tmp/playnest-media",
              "target": "/app/media",
              "bind": {},
          }
          assert api["ports"][0]["host_ip"] == "127.0.0.1"
          assert api["environment"]["SMS_PROVIDER"] == "disabled"
          assert api["environment"]["KAVENEGAR_API_KEY"] == ""

          frontend = config["services"]["frontend"]
          assert frontend["ports"][0]["host_ip"] == "127.0.0.1"
          assert frontend["build"]["args"]["NEXT_PUBLIC_MEDIA_BASE_URL"] == (
              "https://shop.example.invalid/media"
          )
          assert frontend["environment"]["INTERNAL_API_BASE_URL"] == (
              "http://api:8000/api/v1"
          )
          PY

      - name: Exercise production preflight with synthetic storage
        run: |
          set -euo pipefail
          readonly compose_file=docker-compose.prod.yml
          readonly env_file=/tmp/playnest-production-ci.env
          readonly db_backup=/tmp/playnest-production-ci.dump
          readonly media_backup=/tmp/playnest-production-ci-media.tar.gz

          install -m 0600 .env.production.example "$env_file"
          install -d -m 0755 \
            "$PRODUCTION_STATIC_PATH" "$PRODUCTION_MEDIA_PATH"
          printf 'synthetic media fixture\n' > "$PRODUCTION_MEDIA_PATH/synthetic.txt"
          chmod 0644 "$PRODUCTION_MEDIA_PATH/synthetic.txt"
          sudo chown -R 10001:10001 \
            "$PRODUCTION_STATIC_PATH" "$PRODUCTION_MEDIA_PATH"

          docker volume create "$PRODUCTION_POSTGRES_VOLUME_NAME" >/dev/null
          docker compose --env-file "$env_file" -f "$compose_file" \
            up -d --wait db
          docker compose --env-file "$env_file" -f "$compose_file" \
            exec -T db sh -c \
            'exec pg_dump --format=custom --username "$POSTGRES_USER" "$POSTGRES_DB"' \
            > "$db_backup"
          tar -C "$PRODUCTION_MEDIA_PATH" -czf "$media_backup" .

          scripts/production-preflight.sh \
            "$env_file" \
            "$GITHUB_SHA" \
            "$PRODUCTION_COMPOSE_PROJECT_NAME" \
            "$PRODUCTION_POSTGRES_VOLUME_NAME" \
            "$db_backup" \
            "$media_backup"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=production-backend
          cache-to: type=gha,mode=max,scope=production-backend

      - name: Build production frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ env.NEXT_PUBLIC_MEDIA_BASE_URL }}
          cache-from: type=gha,scope=production-frontend
          cache-to: type=gha,mode=max,scope=production-frontend

      - name: Remove synthetic preflight resources
        if: always()
        run: |
          docker compose --env-file /tmp/playnest-production-ci.env \
            -f docker-compose.prod.yml rm --stop --force db || true
          docker network rm playnest-production-ci_default || true
          docker volume rm playnest-production-postgres-ci || true
          sudo rm -rf \
            /tmp/playnest-production-ci.env \
            /tmp/playnest-production-ci.dump \
            /tmp/playnest-production-ci-media.tar.gz \
            /tmp/playnest-staticfiles \
            /tmp/playnest-media
