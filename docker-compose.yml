services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-playnest}
      POSTGRES_USER: ${POSTGRES_USER:-playnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playnest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playnest} -d ${POSTGRES_DB:-playnest}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.42.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_CONSOLE_ALLOWED: ${SMS_CONSOLE_ALLOWED:-True}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      KAVENEGAR_VERIFY_TEMPLATE: ${KAVENEGAR_VERIFY_TEMPLATE:-}
      OTP_EXPIRY_SECONDS: ${OTP_EXPIRY_SECONDS:-120}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_MAX_SENDS_PER_WINDOW: ${OTP_MAX_SENDS_PER_WINDOW:-5}
      OTP_SEND_WINDOW_SECONDS: ${OTP_SEND_WINDOW_SECONDS:-3600}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_BLOCK_SECONDS: ${LOGIN_BLOCK_SECONDS:-900}
      ACCESS_TOKEN_LIFETIME_SECONDS: ${ACCESS_TOKEN_LIFETIME_SECONDS:-900}
      REFRESH_TOKEN_LIFETIME_SECONDS: ${REFRESH_TOKEN_LIFETIME_SECONDS:-604800}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-playnest_refresh}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-Lax}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-False}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-True}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-playnest}
      POSTGRES_USER: ${POSTGRES_USER:-playnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playnest}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- -H 0.0.0.0
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-http://localhost:3000/media}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8000/api/v1}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      NEXT_PUBLIC_UMAMI_DOMAINS: ${NEXT_PUBLIC_UMAMI_DOMAINS:-}
      NEXT_PUBLIC_UMAMI_ENABLE_PERFORMANCE: ${NEXT_PUBLIC_UMAMI_ENABLE_PERFORMANCE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
